name: Fork-sync

permissions:
  contents: write
  # workflows: write  # 对 GITHUB_TOKEN 无效，必须用 PAT

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          # 用 PAT 做 checkout，避免 credential 冲突
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false   # 重要

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: hafrey1/LunaTV-config
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN }}  # 改用 PAT
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 同步失败，请检查 PAT 权限或手动 Sync Fork"
          exit 1

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 5
          token: ${{ secrets.PAT_TOKEN }}  # 若该 action 需要 token
